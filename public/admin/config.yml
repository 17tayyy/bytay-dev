backend:
  name: github
  repo: 17tayyy/bytay-dev
  branch: main
  base_url: https://bytay-cms-oauth.17tay.workers.dev

media_folder: public/images
public_folder: /images

collections:
  - name: blog
    label: Blog
    folder: src/content/blog
    create: true
    slug: "{{slug}}"
    fields:
      - { name: title, label: Title, widget: string }
      - { name: date, label: Date, widget: datetime, time_format: false, format: YYYY-MM-DD }
      - { name: description, label: Description, widget: string }
      - { name: tags, label: Tags, widget: list, default: [] }
      - { name: draft, label: Draft, widget: boolean, default: false }
      - { name: body, label: Body, widget: markdown }

  - name: pages
    label: Pages
    files:
      - name: about
        label: About
        file: src/content/about.md
        fields:
          - name: experience
            label: Experience
            widget: list
            summary: "{{fields.role}}"
            fields:
              - { name: role, label: Role, widget: string }
              - { name: company, label: Company, widget: string }
              - { name: period, label: Period, widget: string }
              - { name: tags, label: Tags, widget: list, default: [] }
              - name: paragraphs
                label: Paragraphs
                widget: list
                field: { name: paragraph, label: Paragraph, widget: text }
          - name: education
            label: Education
            widget: list
            summary: "{{fields.degree}}"
            fields:
              - { name: degree, label: Degree, widget: string }
              - { name: institution, label: Institution, widget: string, required: false }
              - { name: period, label: Period, widget: string }
              - { name: description, label: Description, widget: text, required: false }
          - name: training
            label: Training
            widget: list
            summary: "{{fields.title}}"
            fields:
              - { name: title, label: Title, widget: string }
              - { name: subtitle, label: Subtitle, widget: string, required: false }
              - { name: description, label: Description, widget: text, required: false }
          - { name: body, label: Body, widget: markdown }

      - name: projects
        label: Projects
        file: src/data/projects.json
        format: json
        fields:
          - name: projects
            label: Projects
            widget: list
            summary: "{{fields.name}}"
            fields:
              - { name: name, label: Name, widget: string }
              - { name: status, label: Status, widget: string, required: false }
              - { name: visibility, label: Visibility, widget: string, required: false }
              - { name: type, label: Type, widget: string, required: false }
              - { name: description, label: Description, widget: text }
              - { name: tags, label: Tags, widget: list, default: [] }
              - name: links
                label: Links
                widget: list
                summary: "{{fields.label}}"
                fields:
                  - { name: label, label: Label, widget: string }
                  - { name: href, label: URL, widget: string }

      - name: cv
        label: CV
        file: src/data/cv.json
        format: json
        fields:
          - { name: name, label: Name, widget: string }
          - { name: title, label: Title, widget: string }
          - name: contact
            label: Contact
            widget: object
            fields:
              - { name: email, label: Email, widget: string }
              - { name: github, label: GitHub URL, widget: string }
              - { name: linkedin, label: LinkedIn URL, widget: string }
          - name: experience
            label: Experience
            widget: list
            summary: "{{fields.role}}"
            fields:
              - { name: role, label: Role, widget: string }
              - { name: company, label: Company, widget: string }
              - { name: location, label: Location, widget: string }
              - { name: period, label: Period, widget: string }
              - name: bullets
                label: Bullets
                widget: list
                field: { name: bullet, label: Bullet, widget: text }
              - { name: tags, label: Tags, widget: list, default: [] }
          - name: education
            label: Education
            widget: list
            summary: "{{fields.degree}}"
            fields:
              - { name: degree, label: Degree, widget: string }
              - { name: institution, label: Institution, widget: string, required: false }
              - { name: period, label: Period, widget: string }
              - { name: note, label: Note, widget: string, required: false }
          - name: training
            label: Training
            widget: list
            summary: "{{fields.title}}"
            fields:
              - { name: title, label: Title, widget: string }
              - { name: subtitle, label: Subtitle, widget: string, required: false }
              - { name: period, label: Period, widget: string }
              - { name: note, label: Note, widget: text, required: false }
          - name: skills
            label: Technical Skills
            widget: list
            summary: "{{fields.label}}"
            fields:
              - { name: label, label: Label, widget: string }
              - { name: value, label: Value, widget: string }
          - name: languages
            label: Languages
            widget: list
            summary: "{{fields.label}}"
            fields:
              - { name: label, label: Label, widget: string }
              - { name: value, label: Value, widget: string }
